
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Catálogo de Filmes{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="cabecalho">
        <h1>🎬 Catálogo de Filmes</h1>

        <nav class="menu">
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('novo_filme') }}">Cadastrar filme</a>
        </nav>
    </header>

    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="rodape">
        <p>Catálogo de Filmes — Projeto UC32</p>
    </footer>
</body>
</html>
